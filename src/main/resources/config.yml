# AuraUtils Configuration
# Full reference: README.md (config, features, RTP platform notes)
#
# RTP / teleport chunk loading:
#   Paper  — leave only-loaded-chunks unset/false; use generate-chunks, async-urgent, chunk-load.*, rtp.max-pending-chunk-loads
#   Spigot — set only-loaded-chunks: true and pre-generate worlds for reliable /rtp

# Vanish compatibility (metadata-based; no vanish plugin dependency)
vanish:
  enabled: true
  # Players with this permission still see vanished staff in tab-complete and can target them
  see-permission: aura.vanish.see
  # Bukkit metadata keys that mark a player as vanished (vanish plugins often use "vanished")
  metadata-keys:
    - aura.vanish
    - vanished
    - supervanished

# TPA settings
tpa:
  # How long (seconds) a TPA request stays pending before expiring
  timeout: 60

# Random teleport settings
rtp:
  # When true, pick random coordinates around your current position; when false, around world spawn
  center-on-player: true
  # Search radius in blocks (clamped to the world border when present)
  radius: 2000
  # Minimum horizontal distance from your current position
  minDistance: 100
  # Number of random attempts before giving up
  attempts: 80
  # Number of attempts to try per server tick (spreads load)
  attemptsPerTick: 10
  # Spigot: set true to only search already-loaded chunks (best with pre-generated worlds).
  # Paper: omit or set false to use async chunk loading during search (default when unset).
  # only-loaded-chunks: true
  # Paper: generate terrain during async RTP search (false = pre-generated / existing terrain only)
  generate-chunks: false
  # Paper: prioritize async chunk loads for RTP
  async-urgent: true
  # Paper: max concurrent async chunk loads per active RTP search
  max-pending-chunk-loads: 4
  # Countdown (seconds) before executing the teleport; 0 = immediate
  countdown: 0
  # Cooldown (seconds) between successful RTP uses; 0 = disabled
  cooldown: 60

# Shared async chunk load pipeline (RTP search + teleport destinations on Paper)
chunk-load:
  # Max concurrent async/sync chunk loads server-wide
  max-in-flight-global: 32
  # Max concurrent chunk loads per player (RTP + teleports combined)
  max-in-flight-per-player: 4
  # Queued load requests when global/per-player caps are reached (teleports wait; RTP probes reject)
  max-queue-size: 256

# Global teleport countdown used by warp/home/back/tpa (seconds)
teleport:
  countdown: 5
  # Paper: load destination chunks asynchronously before teleporting
  async-chunk-load: true
  # Spigot: allow one synchronous chunk load at teleport time when the chunk is not loaded
  sync-chunk-fallback: true
  # Seconds to wait for a destination chunk before failing (0 = no timeout)
  chunk-load-timeout-seconds: 10
  # Per-feature overrides (optional). Unset keys inherit global teleport / rtp settings.
  overrides:
    admin:
      countdown: 0
      async-chunk-load: true
    rtp:
      countdown: 0

# Per-player home limits (-1 = unlimited)
homes:
  default-limit: 3
  permission-limits:
    - aura.home.limit.5
    - aura.home.limit.10
    - aura.home.limit.25

# Server-wide settings (re-applied when worlds load, e.g. after ResourceWorldResetter)
server:
  # When true, players keep inventory on death in all worlds (vanilla keepInventory gamerule)
  keep-inventory: false

# Messages (MiniMessage) — edit plugins/AuraUtils/messages/<locale>.yml
messages:
  default-locale: en
  fallback-locale: en
  # When true, uses the client's language on Paper if a matching messages/<locale>.yml exists
  use-client-locale: true

# Feature toggles. Set a feature to false to disable its commands and GUI actions.
features:
  menu: true
  homes: true
  warps: true
  spawn: true
  tpa: true
  rtp: true
  fly: true
  god: true
  nofall: true
  nohunger: true
  heal: true
  feed: true
  keepinventory: true
