# AuraUtils Configuration
# Use /aura reload (aura.admin) after editing, or restart the server.
# Reload applies config.yml and lang/<language>.yml. Warps and homes stay live (not re-read).
# All teleport commands (home, warp, back, TPA, RTP, menu) share the same countdown system.

# ---------------------------------------------------------------------------
# TPA
# ---------------------------------------------------------------------------
tpa:
  # How long (seconds) a TPA request stays pending before expiring
  timeout: 60
  # Maximum players on a trusted list (0 = unlimited)
  trusted-max: 50
  # When true, trusted TPAs skip the shared teleport countdown entirely
  # (instant). When false, they still use teleport.countdown / bypass perm.
  trusted-instant: false

# ---------------------------------------------------------------------------
# Homes
# ---------------------------------------------------------------------------
# Maximum homes for players without a matching permission. 0 = unlimited.
# A configured permission is checked through Bukkit, so LuckPerms groups work
# without any direct LuckPerms dependency. The highest matching positive value
# wins; a matching max: 0 grants unlimited homes.
homes:
  default-limit: 0
  limits:
    # - permission: aura.homes.vip
    #   max: 5
    # - permission: aura.homes.unlimited
    #   max: 0

# ---------------------------------------------------------------------------
# Random teleport (/rtp)
# ---------------------------------------------------------------------------
rtp:
  # Search radius around world spawn in blocks
  radius: 2000
  # Minimum horizontal distance from your current position
  minDistance: 250
  # Number of random column probes before giving up
  attempts: 30
  # Hard cap on search duration (ticks). Prevents watchdog freezes.
  max-search-ticks: 200
  # On Spigot, generating an unloaded chunk is sync and can freeze the server.
  # Paper/Folia ignore this and use getChunkAtAsync instead.
  generate-unloaded: true
  # Maximum sync chunk generations per /rtp on Spigot/CraftBukkit (0 = loaded chunks only)
  max-sync-generations: 3
  # Countdown (seconds) before executing the teleport; 0 = immediate
  # Falls back to teleport.countdown when unset
  countdown: 5

# ---------------------------------------------------------------------------
# Shared teleport settings (warp / home / back / tpa / rtp / menu)
# ---------------------------------------------------------------------------
teleport:
  # Countdown seconds before teleport; 0 = instant
  countdown: 5

  # How to show the countdown in chat / action bar:
  #   chat      – chat messages only
  #   actionbar – action bar only
  #   both      – chat + action bar (default)
  #   none      – no chat or action bar (title can still show)
  countdown-display: both

  # Chat is ALWAYS shown at the start of the countdown.
  # Also show a chat line when these remaining seconds are reached.
  # Examples:
  #   [3, 2, 1]     → messages at start (e.g. 5) then 3, 2, 1  (skips 4 – reduces spam)
  #   [5, 4, 3, 2, 1] → every second when countdown is 5
  #   []            → chat every second (full spam)
  # Default reduces spam while still giving clear feedback.
  chat-at: [3, 2, 1]

  # Show a large title (remaining seconds) + subtitle (destination) during countdown
  title: true

  # Cancel the countdown if the player moves more than a tiny amount
  cancel-on-move: true

  # Cancel the countdown if the player takes damage
  cancel-on-damage: false

  # Play short sounds on start / each tick / success / cancel
  sound: true

  # When sound is true, raise the note-block pitch as the countdown approaches 0
  # (starts lower, ends higher – makes the final seconds more noticeable)
  sound-rising-pitch: true

# ---------------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------------
# Language file under plugins/AuraUtils/lang/<code>.yml (jar default: lang/en.yml)
language: en
# Chat prefix (supports & color codes)
prefix: "&8[&bAura&8] &r"

# ---------------------------------------------------------------------------
# Update checker
# ---------------------------------------------------------------------------
# When true, AuraUtils asks GitHub for the latest release (TamaWish/AuraUtils).
# Console is told if a newer version exists. Players with aura.admin also get a
# chat notice with a clickable link to the GitHub releases page.
update-checker:
  enabled: true
