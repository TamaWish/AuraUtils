# AuraUtils Configuration

# TPA settings
tpa:
  # How long (seconds) a TPA request stays pending before expiring
  timeout: 60

# Random teleport settings
rtp:
  # When true, pick random coordinates around your current position; when false, around world spawn
  center-on-player: true
  # Search radius in blocks (clamped to the world border when present)
  radius: 2000
  # Minimum horizontal distance from your current position
  minDistance: 100
  # Number of random attempts before giving up
  attempts: 80
  # Number of attempts to try per server tick (spreads load)
  attemptsPerTick: 10
  # Countdown (seconds) before executing the teleport; 0 = immediate
  countdown: 0
  # Cooldown (seconds) between successful RTP uses; 0 = disabled
  cooldown: 60

# Global teleport countdown used by warp/home/back/tpa (seconds)
teleport:
  countdown: 5

# Per-player home limits (-1 = unlimited)
homes:
  max-per-player: 5

# Server-wide settings (re-applied when worlds load, e.g. after ResourceWorldResetter)
server:
  # When true, players keep inventory on death in all worlds (vanilla keepInventory gamerule)
  keep-inventory: false

# Messages prefix
prefix: "&8[&bAura&8] &r"
