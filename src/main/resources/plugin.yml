name: AuraUtils
version: ${project.version}
main: me.aurautils.AuraUtils
api-version: "1.21"
description: Utility bundle — async-safe RTP, TPA, homes, warps, and more.
author: YourName

commands:
  menu:
    description: Open the main utility GUI
    usage: /menu
    permission: aura.use
  back:
    description: Return to your last teleport location
    usage: /back
    permission: aura.back
  warp:
    description: Teleport to a warp or open the warp GUI
    usage: /warp [name|list]
    aliases: [warplist]
    permission: aura.warp
  setwarp:
    description: Create or update a warp
    usage: /setwarp <name>
    permission: aura.warp.set
  delwarp:
    description: Delete a warp
    usage: /delwarp <name>
    permission: aura.warp.delete
  home:
    description: Teleport to a home or open the home GUI
    usage: /home [name|list]
    aliases: [homelist]
    permission: aura.home
  sethome:
    description: Create or update a home
    usage: /sethome <name>
    permission: aura.home.set
  delhome:
    description: Delete a home
    usage: /delhome <name>
    permission: aura.home.delete
  tpa:
    description: Send a TPA request to a player or open the TPA GUI
    usage: /tpa <player>|list
    aliases: [tplist]
    permission: aura.tpa
  tpahere:
    description: Ask a player to teleport to you
    usage: /tpahere <player>
    permission: aura.tpahere
  tpaccept:
    description: Accept a pending TPA request
    usage: /tpaccept
    permission: aura.tpaccept
  tpadeny:
    description: Deny a pending TPA request
    usage: /tpadeny
    permission: aura.tpdeny
  god:
    description: Toggle god mode (invincibility)
    usage: /god [player]
    permission: aura.god
  fly:
    description: Toggle fly mode
    usage: /fly [player]
    permission: aura.fly
  nofall:
    description: Toggle fall damage
    usage: /nofall [player]
    permission: aura.nofall
  nohunger:
    description: Toggle hunger depletion
    usage: /nohunger [player]
    permission: aura.nohunger
  rtp:
    description: Randomly teleport to a safe location
    usage: /rtp
    permission: aura.rtp
  setspawn:
    description: Set the spawn point for your current world
    usage: /setspawn
    permission: aura.setspawn
  keepinventory:
    description: Toggle keep inventory on death for all worlds
    usage: /keepinventory [on|off|status]
    permission: aura.keepinventory
  aura:
    description: Show AuraUtils info and commands
    usage: /aura
    permission: aura.use
  auracanceltp:
    description: Cancel a pending AuraUtils teleport countdown
    usage: /auracanceltp
    permission: aura.use

permissions:
  aura.use:
    description: Basic access
    default: true
  aura.menu:
    description: Open the utility menu
    default: true
  aura.back:
    description: Return to last teleport location
    default: true
  aura.warp:
    description: Use all warps (or grant aura.warp.<name> per warp instead)
    default: true
  aura.warp.admin:
    description: Administrative warp access
    default: op
  aura.warp.set:
    description: Set warps
    default: op
  aura.warp.delete:
    description: Delete warps
    default: op
  aura.home:
    description: Use home commands
    default: true
  aura.home.set:
    description: Set homes
    default: true
  aura.home.delete:
    description: Delete homes
    default: true
  aura.home.limit.3:
    description: Allow up to 3 homes
    default: true
  aura.home.limit.5:
    description: Allow up to 5 homes
    default: true
  aura.home.limit.10:
    description: Allow up to 10 homes
    default: true
  aura.home.limit.25:
    description: Allow up to 25 homes
    default: true
  aura.tpa:
    description: Use TPA commands
    default: true
  aura.tpahere:
    description: Use TPA Here
    default: true
  aura.tpaccept:
    description: Accept pending TPA requests
    default: true
  aura.tpdeny:
    description: Deny pending TPA requests
    default: true
  aura.god:
    description: Use god mode
    default: op
  aura.god.others:
    description: Toggle god mode on others
    default: op
  aura.fly:
    description: Use fly
    default: op
  aura.fly.others:
    description: Toggle fly on others
    default: op
  aura.nofall:
    description: Toggle fall damage
    default: op
  aura.nofall.others:
    description: Toggle fall damage on others
    default: op
  aura.nohunger:
    description: Toggle hunger
    default: op
  aura.nohunger.others:
    description: Toggle hunger on others
    default: op
  aura.rtp:
    description: Use random teleport
    default: true
  aura.rtp.cooldown.bypass:
    description: Bypass RTP cooldowns
    default: op
  aura.setspawn:
    description: Set world spawn points
    default: op
  aura.keepinventory:
    description: Toggle keep inventory on death for the server
    default: op
  aura.admin:
    description: All AuraUtils permissions
    default: op
    children:
      aura.god: true
      aura.god.others: true
      aura.fly: true
      aura.fly.others: true
      aura.nofall: true
      aura.nofall.others: true
      aura.nohunger: true
      aura.nohunger.others: true
      
      aura.tpa: true
      aura.tpahere: true
      aura.tpaccept: true
      aura.tpdeny: true
      aura.menu: true
      aura.back: true
      aura.warp: true
      aura.warp.admin: true
      aura.warp.set: true
      aura.warp.delete: true
      aura.home: true
      aura.home.set: true
      aura.home.delete: true
      aura.home.limit.3: true
      aura.home.limit.5: true
      aura.home.limit.10: true
      aura.home.limit.25: true
      aura.rtp: true
      aura.rtp.cooldown.bypass: true
      aura.setspawn: true
      aura.keepinventory: true
