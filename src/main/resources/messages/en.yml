# AuraUtils — English (MiniMessage)
# Global placeholder <prefix> is injected automatically.
# Per-message placeholders are documented inline.

meta:
  prefix: "<dark_gray>[<gradient:#00d2ff:#3a7bd5>Aura</gradient>]</dark_gray> "

toggle:
  enabled: "<green>enabled"
  disabled: "<red>disabled"

general:
  no-permission: "<prefix><red>No permission."
  no-permission-short: "<prefix><red>You don't have permission."
  player-not-found: "<prefix><red>Player not found."
  player-offline: "<prefix><red>Player <yellow><name></yellow> is not online."
  usage: "<prefix><yellow>Usage: <white><usage></white>"

feature:
  disabled: "<prefix><red>This feature is currently disabled."

teleport:
  countdown: "<prefix><yellow>Teleporting in <gold><seconds></gold><gray>s</gray>… <hover:show_text:'<gray>Click to cancel'><click:run_command:/auracanceltp><red><bold>✕</bold></red></click></hover>"
  cancelled: "<prefix><red>Teleport cancelled."
  cancelled-movement: "<prefix><red>Teleport cancelled due to movement."
  cancelled-manual: "<prefix><red>Teleport cancelled."
  success-default: "<prefix><green>Teleported."
  success-spawn: "<prefix><green>Teleported to spawn."
  success-home: "<prefix><green>Teleported to home <yellow><name></yellow><green>."
  success-warp: "<prefix><green>Teleported to warp <yellow><name></yellow><green>."
  success-back: "<prefix><green>Returned to your last teleport location."
  success-rtp: "<prefix><green>Teleported to a random safe location."
  chunk-unavailable: "<prefix><red>Destination chunk is not loaded. Try again or explore the area first."
  chunk-timeout: "<prefix><red>Destination chunk took too long to load. Try again."
  world-invalid: "<prefix><red>That destination is invalid."
  world-unloaded: "<prefix><red>World <yellow><world></yellow> is not loaded."
  no-back: "<prefix><red>You have no previous teleport location."

rtp:
  searching: "<prefix><yellow>Searching for a safe location…"
  cooldown: "<prefix><red>RTP is on cooldown. Try again in <yellow><seconds>s<red>."
  found-countdown: "<prefix><green>Found a spot <yellow><blocks></yellow> blocks away. Stand still!"
  success-instant: "<prefix><green>Teleported <yellow><blocks></yellow> blocks to a random safe location."
  failed: "<prefix><red>Could not find a safe location. Lower <yellow>rtp.minDistance</yellow>, increase <yellow>rtp.attempts</yellow>, or on Spigot pre-generate terrain and keep <yellow>rtp.only-loaded-chunks</yellow> enabled."
  world-invalid: "<prefix><red>That world is not allowed for RTP."
  world-unloaded: "<prefix><red>World <yellow><world></yellow> is not loaded."

tpa:
  usage-tpa: "<prefix><yellow>Usage: <white>/tpa <player></white>"
  usage-tpahere: "<prefix><yellow>Usage: <white>/tpahere <player></white>"
  self: "<prefix><red>You can't TPA to yourself."
  self-here: "<prefix><red>You can't send TPA Here to yourself."
  pending-blocked: "<prefix><red>That player already has a pending request. Wait for it to expire."
  sent: "<prefix><green>TPA request sent to <yellow><target></yellow><green>. Expires in <aqua><timeout>s</aqua><green>."
  sent-here: "<prefix><green>TPA Here request sent to <yellow><target></yellow><green>. Expires in <aqua><timeout>s</aqua><green>."
  received: "<prefix><yellow><requester></yellow> <green>wants to teleport to you. Use <aqua>/tpaccept</aqua> or <red>/tpadeny</red><green>."
  received-here: "<prefix><yellow><requester></yellow> <green>wants you to teleport to them. Use <aqua>/tpaccept</aqua> or <red>/tpadeny</red><green>."
  no-pending: "<prefix><red>You have no pending TPA request."
  accepted-countdown-traveler: "<prefix><yellow>Your TPA request was accepted. Teleporting in <gold><seconds></gold><yellow>…"
  accepted-countdown-destination: "<prefix><yellow><traveler></yellow> <green>has a teleport scheduled to you."
  accepted-instant-traveler: "<prefix><green>Teleported to <yellow><destination></yellow><green>!"
  accepted-instant-destination: "<prefix><yellow><traveler></yellow> <green>has teleported to you."
  denied-requester: "<prefix><red><target></red> <red>declined your TPA request."
  denied-target: "<prefix><red>You denied <yellow><requester></yellow><red>'s TPA request."
  expired-requester: "<prefix><yellow>Your TPA request to <aqua><target></aqua> <yellow>expired."
  expired-target: "<prefix><yellow>TPA request from <aqua><requester></aqua> <yellow>expired."

tphere:
  usage: "<prefix><yellow>Usage: <white>/tphere <player></white>"
  self: "<prefix><red>You cannot teleport yourself to yourself."
  teleported-traveler: "<prefix><green>Teleported to <yellow><destination></yellow><green>."
  teleported-destination: "<prefix><yellow><traveler></yellow> <green>was teleported to you."
  teleported-sender: "<prefix><green>Teleported <yellow><player></yellow> <green>to you."
  countdown-traveler: "<prefix><yellow>Teleporting to <aqua><destination></aqua> in <gold><seconds></gold><yellow>s…"
  countdown-destination: "<prefix><yellow><traveler></yellow> <green>will teleport to you in <gold><seconds></gold><green>s…"

tpall:
  none: "<prefix><yellow>No other players are online to teleport."
  summary: "<prefix><green>Teleporting <yellow><count></yellow> player(s) to you."

warp:
  not-found: "<prefix><red>Warp <yellow><name></yellow> <red>was not found."
  no-permission: "<prefix><red>You don't have permission to use warp <yellow><name></yellow><red>."
  cooldown: "<prefix><red>Warp <yellow><name></yellow> <red>is on cooldown. Try again in <yellow><seconds>s<red>."
  set: "<prefix><green>Set warp <yellow><name></yellow><green>."
  deleted: "<prefix><green>Deleted warp <yellow><name></yellow><green>."
  usage-set: "<prefix><yellow>Usage: <white>/setwarp <name></white>"
  usage-del: "<prefix><yellow>Usage: <white>/delwarp <name></white>"

home:
  not-found: "<prefix><red>Home <yellow><name></yellow> <red>was not found."
  set: "<prefix><green>Set home <yellow><name></yellow><green>."
  deleted: "<prefix><green>Deleted home <yellow><name></yellow><green>."
  limit: "<prefix><red>You have reached the home limit (<yellow><max></yellow><red>). Delete a home first."
  usage-set: "<prefix><yellow>Usage: <white>/sethome <name></white>"
  usage-del: "<prefix><yellow>Usage: <white>/delhome <name></white>"

adminhome:
  usage: "<prefix><yellow>Usage: <white>/adminhome <player|uuid> list|del <name></white>"
  player-not-found: "<prefix><red>No player found for <yellow><target></yellow><red>."
  list-header: "<prefix><gray>Homes for <yellow><player></yellow> <gray>(<white><count></white><gray>):"
