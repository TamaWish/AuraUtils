  list-empty: "<prefix><yellow><player></yellow> <gray>has no homes."
  deleted: "<prefix><green>Deleted home <yellow><name></yellow> <green>for <yellow><player></yellow><green>."

spawn:
  set: "<prefix><green>Set spawn for world <yellow><world></yellow> <gray>(<white><coords></white><gray>). <dark_gray>Persists across resource-world resets."

heal:
