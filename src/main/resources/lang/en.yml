# AuraUtils English messages
# Copy this file to lang/<code>.yml and set language: <code> in config.yml.
# Placeholders use %name% style. Color codes use & (same as config.yml).
# Missing keys always fall back to the jar English defaults.

common:
  no-permission: "&cNo permission."
  player-not-found: "&cPlayer not found."
  player-not-online: "&cPlayer &e%name% &cis not online."
  console-players-only: "Console cannot use %command%."
  console-specify-player: "Console must specify a player."
  cannot-toggle-others: "&cYou can't toggle %feature% on others."
  enabled: "&aENABLED&r"
  disabled: "&cDISABLED&r"
  # Quote on/off — YAML 1.1 otherwise treats them as booleans and /aura shows "common.on".
  # Trailing &r stops the color from leaking into the next label on the same line.
  "on": "&aON&r"
  "off": "&cOFF&r"
  unknown-world: "unknown"
  unknown: "Unknown"
  coords-unknown: "?, ?, ?"
  confirm-button: "[CONFIRM]"
  cancel-button: "[CANCEL]"

aura:
  reload: "&aConfiguration reloaded (config.yml and lang/%language%.yml)."
  reload-stores: "&7Warps/homes are live-managed and were not re-read from disk."
  help:
    - "&8&m------------------------------------"
    - "  &bAura&fUtils &7v%version%"
    - "&7  Your utility bundle for Minecraft."
    - ""
    - "  &e/tpa &8<player>    &7- Request teleport"
    - "  &e/tpaccept        &7- Accept TPA"
    - "  &e/tpadeny         &7- Deny TPA"
    - "  &e/tpacancel       &7- Cancel pending teleport"
    - "  &e/tpatrust &8<player|list> &7- Trusted TPA list"
    - "  &e/tpauntrust &8<player> &7- Remove from trusted"
    - "  &e/warp &8[<name>|list] &7- Teleport to a warp or open GUI"
    - "  &e/setwarp &8<name> &7- Set a warp"
    - "  &e/delwarp &8<name> &7- Delete a warp"
    - "  &e/home &8[<name>|list] &7- Teleport to a home or open GUI"
    - "  &e/sethome &8<name> &7- Set a home"
    - "  &e/delhome &8<name> &7- Delete a home"
    - "  &e/back &7- Return to your last teleport"
    - "  &e/menu &7- Open the utility GUI"
    - "  &e/god &8[player]   &7- Toggle god mode"
    - "  &e/fly &8[player]   &7- Toggle fly"
    - "  &e/nofall &8[p]     &7- Toggle fall damage"
    - "  &e/nohunger &8[p]   &7- Toggle hunger"
    - "  &e/aura reload    &7- Reload config"
    - "  &e/rtp &7- Random safe teleport"
  help-footer: "&8&m------------------------------------"
  status-header: "  &7Your status:"
  status-toggles: "  &7God: %god%  &7Fly: %fly%"
  status-protection: "  &7NoFall: %nofall%  &7NoHunger: %nohunger%"

